name: Intraday Refresh

# Tiered refresh cadence. Invoked by Vercel Cron (vercel.json) via
# GET /api/cron/etl?job=a|b → workflow_dispatch, not by GitHub's own
# `schedule:` trigger — see the note in daily-etl.yml for why. Dispatched runs
# start immediately, so the times in vercel.json are the real cadence.
#
#   Tier A — Finnhub quotes (stocks/ETFs/crypto), ESPN scoreboards, Finnhub
#     market news. Consumes no daily API budget. 11 slots/day.
#   Tier B — adds NYT top stories, ESPN news, and FMP forex/commodity quotes.
#     6 slots/day x 13 FMP calls = 78, + the daily run's 21 = 99 of the 250/day
#     cap. Three of the six sit at 10/11/12 UTC so the 7-9am ET window always
#     has a fresh Tier B behind it under both EDT and EST.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Refresh tier
        type: choice
        options: [a, b]
        default: a
      triggered_by:
        description: Value recorded in etl_runs.triggered_by
        type: choice
        options: [cron, manual]
        default: manual

# Shares the 'etl' group with the daily workflow so refreshes never overlap
# a daily run (same rate-limited APIs and tables). A refresh that fires
# mid-daily simply queues.
concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Quick Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NYT_API_KEY_1:             ${{ secrets.NYT_API_KEY_1 }}
      NYT_API_KEY_2:             ${{ secrets.NYT_API_KEY_2 }}
      NYT_API_KEY_3:             ${{ secrets.NYT_API_KEY_3 }}
      FINNHUB_API_KEY_1:         ${{ secrets.FINNHUB_API_KEY_1 }}
      FINNHUB_API_KEY_2:         ${{ secrets.FINNHUB_API_KEY_2 }}
      FINNHUB_API_KEY_3:         ${{ secrets.FINNHUB_API_KEY_3 }}
      FMP_API_KEY:               ${{ secrets.FMP_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quick refresh
        # Exits 1 only on run status `failed`, which is what makes GitHub email
        # about this workflow. A lost upstream (ESPN 403ing the runner, a
        # Finnhub/NYT 429) lands on `partial` and exits 0 until it persists
        # across several runs — see src/api/docs/RUNBOOK.md, "Run Status".
        run: python src/api/run_quick_refresh.py --tier "${{ inputs.tier }}" --triggered-by "${{ inputs.triggered_by || 'manual' }}"
        env:
          PYTHONPATH: src/api

      - name: Revalidate site cache
        # Not `success()`: a run is marked failed when any one domain writes
        # nothing, but the other domains' rows are already in the database by
        # then. Gating the cache bust on a clean run left fresh sports, markets
        # and news behind a stale cache for an hour (or a day) because YouTube
        # blipped. revalidateTag only invalidates — if nothing was written, the
        # refetch returns the same rows, so running it unconditionally is safe.
        if: ${{ !cancelled() }}
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$SITE_URL" ] && [ -n "$REVALIDATE_SECRET" ]; then
            curl -fsS -X POST "$SITE_URL/api/revalidate" \
              -H "Authorization: Bearer $REVALIDATE_SECRET" \
              || echo "::warning::revalidate call failed (non-fatal)"
          else
            echo "NEXT_PUBLIC_SITE_URL / REVALIDATE_SECRET not set — skipping revalidate"
          fi
