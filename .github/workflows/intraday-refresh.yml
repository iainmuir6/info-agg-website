name: Intraday Refresh

# Tiered refresh cadence (docs/IMPROVEMENT_PLAN.md §1.1). Times in UTC;
# ET is UTC-4 (EDT) / UTC-5 (EST).
#
# Minutes are deliberately OFF the quarter-hour marks — GitHub's scheduler
# is most congested at :00/:15/:30/:45 and fires late there (this repo saw
# multi-hour delays); odd minutes keep the delay small.
#
#   Tier A — every 15 min at :07/:22/:37/:52, 12:00–03:59 UTC
#     (8am–11:59pm EDT): Finnhub quotes (stocks/ETFs/crypto), ESPN
#     scoreboards, Finnhub market news. Consumes no daily API budget.
#   Tier B — hourly at :41, 10:41–23:41 UTC (6:41am–7:41pm EDT): adds NYT
#     top stories, ESPN news, and FMP forex/commodity quotes. 14 runs/day
#     × 13 FMP calls = 182, + the daily run's 21 ≈ 203 of the 250/day cap.
on:
  schedule:
    - cron: '7,22,37,52 12-23 * * *'   # Tier A — daytime/evening
    - cron: '7,22,37,52 0-3 * * *'     # Tier A — late evening ET
    - cron: '41 10-23 * * *'           # Tier B — hourly
  workflow_dispatch:
    inputs:
      tier:
        description: Refresh tier
        type: choice
        options: [a, b]
        default: a

# Shares the 'etl' group with the daily workflow so refreshes never overlap
# a daily run (same rate-limited APIs and tables). A refresh that fires
# mid-daily simply queues.
concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Quick Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NYT_API_KEY_1:             ${{ secrets.NYT_API_KEY_1 }}
      NYT_API_KEY_2:             ${{ secrets.NYT_API_KEY_2 }}
      NYT_API_KEY_3:             ${{ secrets.NYT_API_KEY_3 }}
      FINNHUB_API_KEY_1:         ${{ secrets.FINNHUB_API_KEY_1 }}
      FINNHUB_API_KEY_2:         ${{ secrets.FINNHUB_API_KEY_2 }}
      FINNHUB_API_KEY_3:         ${{ secrets.FINNHUB_API_KEY_3 }}
      FMP_API_KEY:               ${{ secrets.FMP_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve tier
        id: tier
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TIER: ${{ inputs.tier }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tier="${INPUT_TIER:-a}"
            trigger="dispatch"
          elif [ "$SCHEDULE" = "41 10-23 * * *" ]; then
            tier="b"
            trigger="cron"
          else
            tier="a"
            trigger="cron"
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "trigger=$trigger" >> "$GITHUB_OUTPUT"

      - name: Run quick refresh
        run: python src/api/run_quick_refresh.py --tier "${{ steps.tier.outputs.tier }}" --triggered-by "${{ steps.tier.outputs.trigger }}"
        env:
          PYTHONPATH: src/api

      - name: Revalidate site cache
        # Not `success()`: a run is marked failed when any one domain writes
        # nothing, but the other domains' rows are already in the database by
        # then. Gating the cache bust on a clean run left fresh sports, markets
        # and news behind a stale cache for an hour (or a day) because YouTube
        # blipped. revalidateTag only invalidates — if nothing was written, the
        # refetch returns the same rows, so running it unconditionally is safe.
        if: ${{ !cancelled() }}
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$SITE_URL" ] && [ -n "$REVALIDATE_SECRET" ]; then
            curl -fsS -X POST "$SITE_URL/api/revalidate" \
              -H "Authorization: Bearer $REVALIDATE_SECRET" \
              || echo "::warning::revalidate call failed (non-fatal)"
          else
            echo "NEXT_PUBLIC_SITE_URL / REVALIDATE_SECRET not set — skipping revalidate"
          fi
