name: Daily ETL

on:
  schedule:
    - cron: '5 12 * * *'  # 7:05 AM ET (12:05 UTC) every day — offset to avoid on-the-hour congestion
  workflow_dispatch:       # Manual trigger from GitHub Actions UI

jobs:
  run-etl:
    name: Run Full ETL Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL:        ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:       ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NYT_API_KEY_1:                   ${{ secrets.NYT_API_KEY_1 }}
      NYT_API_KEY_2:                   ${{ secrets.NYT_API_KEY_2 }}
      FINNHUB_API_KEY_1:               ${{ secrets.FINNHUB_API_KEY_1 }}
      FINNHUB_API_KEY_2:               ${{ secrets.FINNHUB_API_KEY_2 }}
      FMP_API_KEY:                     ${{ secrets.FMP_API_KEY }}
      ALPHA_VANTAGE_API_KEY:           ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      ALPHA_VANTAGE_API_KEY_1:         ${{ secrets.ALPHA_VANTAGE_API_KEY_1 }}
      ALPHA_VANTAGE_API_KEY_2:         ${{ secrets.ALPHA_VANTAGE_API_KEY_2 }}
      SPOTIFY_CLIENT_ID:               ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET:           ${{ secrets.SPOTIFY_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL pipeline
        run: python src/api/run_etl.py
        env:
          PYTHONPATH: src/api
