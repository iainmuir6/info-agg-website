name: Daily ETL

on:
  schedule:
    # 10:43 UTC = 6:43am EDT / 5:43am EST. GitHub fires crons late when the
    # scheduler is congested — load peaks at :00/:15/:30/:45 and around
    # 12:00–14:00 UTC, where this repo saw 1.5–2.5h delays. An odd minute in
    # a quieter hour keeps the delay small while staying pre-market (cleanup
    # collapses completed NY trading days).
    - cron: '43 10 * * *'
  workflow_dispatch:       # Manual trigger from GitHub Actions UI or the admin button

# Never overlap with another daily run or an intraday refresh — they hit the
# same rate-limited APIs and tables.
concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # failure step opens/updates an issue

jobs:
  run-etl:
    name: Run Full ETL Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL:        ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:       ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NYT_API_KEY_1:                   ${{ secrets.NYT_API_KEY_1 }}
      NYT_API_KEY_2:                   ${{ secrets.NYT_API_KEY_2 }}
      NYT_API_KEY_3:                   ${{ secrets.NYT_API_KEY_3 }}
      FINNHUB_API_KEY_1:               ${{ secrets.FINNHUB_API_KEY_1 }}
      FINNHUB_API_KEY_2:               ${{ secrets.FINNHUB_API_KEY_2 }}
      FINNHUB_API_KEY_3:               ${{ secrets.FINNHUB_API_KEY_3 }}
      FMP_API_KEY:                     ${{ secrets.FMP_API_KEY }}
      ALPHA_VANTAGE_API_KEY:           ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      ALPHA_VANTAGE_API_KEY_1:         ${{ secrets.ALPHA_VANTAGE_API_KEY_1 }}
      ALPHA_VANTAGE_API_KEY_2:         ${{ secrets.ALPHA_VANTAGE_API_KEY_2 }}
      ALPHA_VANTAGE_API_KEY_3:         ${{ secrets.ALPHA_VANTAGE_API_KEY_3 }}
      YOUTUBE_API_KEY:                 ${{ secrets.YOUTUBE_API_KEY }}
      # YouTube Data API v3 accepts a plain Google Cloud API key, so either
      # secret works; get_youtube_api_key() falls back to this one. Whichever
      # is absent resolves to empty and is simply ignored.
      GOOGLE_API_KEY:                  ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --cleanup runs info_agg.cleanup_daily() retention after the domains
      # complete: intraday quotes collapse to EOD, 7-day news pruning, etc.
      # The 10:43 UTC schedule is before US market open, so every prior
      # NY-calendar day is a completed trading day.
      - name: Run ETL pipeline with retention cleanup
        run: python src/api/run_etl.py --triggered-by cron --cleanup --season-schedules --output etl-report.json
        env:
          PYTHONPATH: src/api

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-report-${{ github.run_id }}
          path: etl-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Revalidate site cache
        # Not `success()`: a run is marked failed when any one domain writes
        # nothing, but the other domains' rows are already in the database by
        # then. Gating the cache bust on a clean run left fresh sports, markets
        # and news behind a stale cache for an hour (or a day) because YouTube
        # blipped. revalidateTag only invalidates — if nothing was written, the
        # refetch returns the same rows, so running it unconditionally is safe.
        if: ${{ !cancelled() }}
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$SITE_URL" ] && [ -n "$REVALIDATE_SECRET" ]; then
            curl -fsS -X POST "$SITE_URL/api/revalidate" \
              -H "Authorization: Bearer $REVALIDATE_SECRET" \
              || echo "::warning::revalidate call failed (non-fatal)"
          else
            echo "NEXT_PUBLIC_SITE_URL / REVALIDATE_SECRET not set — skipping revalidate"
          fi

      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create etl-failure --repo "$GITHUB_REPOSITORY" --force \
            --description "Automated ETL failure reports" --color B60205 || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label etl-failure \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Daily ETL failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label etl-failure \
              --title "Daily ETL failing" \
              --body "The scheduled ETL run failed. Logs: $RUN_URL

          This issue is updated by the workflow on each failure; close it once the pipeline is green."
          fi
