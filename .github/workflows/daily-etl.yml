name: Daily ETL

on:
  # No `schedule:` — GitHub's scheduled-workflow delivery for this repo
  # degraded badly in Aug 2026: the 10:43 UTC cron was firing between 14:58
  # and 21:14 UTC (4-10h late) and most intraday crons were dropped outright,
  # which left the site 8-12h stale every morning. The clock now lives in
  # vercel.json, which calls GET /api/cron/etl?job=daily → workflow_dispatch.
  # Dispatched runs start immediately.
  workflow_dispatch:       # Vercel cron, the /dashboard admin button, or the Actions UI
    inputs:
      triggered_by:
        description: Value recorded in etl_runs.triggered_by
        type: choice
        options: [cron, manual]
        default: manual

# Never overlap with another daily run or an intraday refresh — they hit the
# same rate-limited APIs and tables.
concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # failure step opens/updates an issue

jobs:
  run-etl:
    name: Run Full ETL Pipeline
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL:        ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY:       ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NYT_API_KEY_1:                   ${{ secrets.NYT_API_KEY_1 }}
      NYT_API_KEY_2:                   ${{ secrets.NYT_API_KEY_2 }}
      NYT_API_KEY_3:                   ${{ secrets.NYT_API_KEY_3 }}
      FINNHUB_API_KEY_1:               ${{ secrets.FINNHUB_API_KEY_1 }}
      FINNHUB_API_KEY_2:               ${{ secrets.FINNHUB_API_KEY_2 }}
      FINNHUB_API_KEY_3:               ${{ secrets.FINNHUB_API_KEY_3 }}
      FMP_API_KEY:                     ${{ secrets.FMP_API_KEY }}
      YOUTUBE_API_KEY:                 ${{ secrets.YOUTUBE_API_KEY }}
      # Misc domain. Each is optional: an unset key makes that one card skip
      # with a note rather than failing the domain (see sync_misc_data).
      WEATHER_API_KEY:                 ${{ secrets.WEATHER_API_KEY }}
      CALENDAR_API_KEY:                ${{ secrets.CALENDAR_API_KEY }}
      COUNTRIES_API_KEY:               ${{ secrets.COUNTRIES_API_KEY }}
      # Summary domain (AI briefings). Optional in the same way: unset means
      # the two summary cards skip with a note. Intentionally NOT reusing
      # GOOGLE_API_KEY below — that is the YouTube key, and the two are only
      # interchangeable if one key has both APIs enabled.
      GEMINI_API_KEY:                  ${{ secrets.GEMINI_API_KEY }}
      # YouTube Data API v3 accepts a plain Google Cloud API key, so either
      # secret works; get_youtube_api_key() falls back to this one. Whichever
      # is absent resolves to empty and is simply ignored.
      GOOGLE_API_KEY:                  ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --cleanup runs info_agg.cleanup_daily() retention after the domains
      # complete: intraday quotes collapse to EOD, 7-day news pruning, etc.
      # The 09:00 UTC Vercel Cron slot is before US market open, so every
      # prior NY-calendar day is a completed trading day.
      # Inputs go through env, never interpolated into the shell line.
      - name: Run ETL pipeline with retention cleanup
        run: python src/api/run_etl.py --triggered-by "$TRIGGERED_BY" --cleanup --season-schedules --output etl-report.json
        env:
          TRIGGERED_BY: ${{ inputs.triggered_by || 'manual' }}
          PYTHONPATH: src/api

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-report-${{ github.run_id }}
          path: etl-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Revalidate site cache
        # Not `success()`: a run is marked failed when any one domain writes
        # nothing, but the other domains' rows are already in the database by
        # then. Gating the cache bust on a clean run left fresh sports, markets
        # and news behind a stale cache for an hour (or a day) because YouTube
        # blipped. revalidateTag only invalidates — if nothing was written, the
        # refetch returns the same rows, so running it unconditionally is safe.
        if: ${{ !cancelled() }}
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$SITE_URL" ] && [ -n "$REVALIDATE_SECRET" ]; then
            # Strip any trailing slash: "$SITE_URL/api/revalidate" would
            # otherwise be "//api/revalidate", which Vercel answers with a 308.
            # `curl -f` does not fail on a 3xx and this call did not follow
            # redirects, so the step exited 0 while never busting the cache.
            # -L is belt-and-braces (308 preserves the POST method).
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' \
              -X POST "${SITE_URL%/}/api/revalidate" \
              -H "Authorization: Bearer $REVALIDATE_SECRET") || code=000
            if [ "$code" = "200" ]; then
              echo "revalidated (HTTP $code)"
            else
              echo "::warning::revalidate call failed (HTTP $code, non-fatal)"
            fi
          else
            echo "NEXT_PUBLIC_SITE_URL / REVALIDATE_SECRET not set — skipping revalidate"
          fi

      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create etl-failure --repo "$GITHUB_REPOSITORY" --force \
            --description "Automated ETL failure reports" --color B60205 || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label etl-failure \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Daily ETL failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label etl-failure \
              --title "Daily ETL failing" \
              --body "The scheduled ETL run failed. Logs: $RUN_URL

          This issue is updated by the workflow on each failure; close it once the pipeline is green."
          fi
